
name: Neon Buddies AI Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily content
        run: python main.py

      - name: Save generated content
        run: |
          git config user.name "Neon Buddies Bot"
          git config user.email "actions@github.com"
          git add daily_plan.json post.txt
          git commit -m "Generate daily Neon Buddies content" || exit 0
          git push
